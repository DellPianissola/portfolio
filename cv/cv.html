<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gabriel Pianissola</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root { --navy: #1d2242; --vivid: #2458e6; --tint: #eaf0fd; --sky: #a9c3fb; --mist: #c9d6fb; --muted: #48526f; }
@page { size: A4; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html, body { width: 210mm; height: 297mm; overflow: hidden; }
body { font: 500 9.6pt/1.46 Manrope, sans-serif; color: var(--navy); background: #fff; display: grid; grid-template-rows: 62mm 1fr; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }

.band { position: relative; overflow: hidden; background-color: var(--vivid); background-image: linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px); background-size: 12mm 12mm; color: #fff; padding: 9mm 12mm; display: flex; flex-direction: column; justify-content: center; }
.band img.me { position: absolute; right: 8mm; bottom: 0; height: 60mm; width: auto; }
.band h1 { display: flex; align-items: center; gap: 3mm; font-size: 29pt; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
.band h1 img { height: 11mm; width: auto; }
.role { margin-top: 2mm; font-size: 12.5pt; font-weight: 700; letter-spacing: -0.01em; }
.ways { display: grid; grid-template-columns: auto auto; justify-content: start; gap: 0.6mm 7mm; margin-top: 4mm; font-size: 8.4pt; font-weight: 700; }

.page { display: grid; grid-template-columns: 1fr 62mm; min-height: 0; }
main { padding: 8mm 8mm 7mm 12mm; display: flex; flex-direction: column; gap: 6mm; }
aside { background: var(--navy); color: var(--mist); padding: 8mm 8mm 7mm; display: flex; flex-direction: column; gap: 6mm; }

h2 { font-size: 12pt; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; color: var(--vivid); margin-bottom: 1.8mm; }
aside h2 { color: #fff; }
.lead { font-size: 10pt; line-height: 1.45; }

.job + .job { margin-top: 4mm; }
.job-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
.job-head b { font-size: 11pt; font-weight: 800; }
.job-head time { flex: none; font-size: 8pt; font-weight: 700; color: var(--muted); }
.job-role { color: var(--vivid); font-weight: 700; margin-bottom: 1mm; }
.job li { position: relative; padding-left: 3.2mm; color: #2f3756; }
.job li + li { margin-top: 0.5mm; }
.job li::before { content: ""; position: absolute; left: 0; top: 0.58em; width: 1.3mm; height: 1.3mm; background: var(--vivid); }
.job li b { color: var(--navy); font-weight: 800; }

.projs li + li { margin-top: 1.3mm; }
.projs b { font-weight: 800; }
.projs span { color: #2f3756; }

.stack dt { color: var(--sky); font-size: 8.2pt; font-weight: 700; margin-top: 2mm; }
.stack dt:first-child { margin-top: 0; }
.stack dd { color: #fff; font-size: 8.8pt; line-height: 1.38; }
.edu li + li { margin-top: 1.8mm; }
.edu b { display: block; color: #fff; font-weight: 700; line-height: 1.3; }
.edu span { font-size: 8pt; display: block; }
</style>
</head>
<body>
<header class="band">
    <h1>Gabriel Pianissola <img src="../images/logo-white.svg" alt=""></h1>
    <p class="role" data-t="role"></p>
    <div class="ways">
        <a href="mailto:dell.pianissola@outlook.com">dell.pianissola@outlook.com</a>
        <a href="https://portfolio.dell-pianissola.workers.dev/">portfolio.dell-pianissola.workers.dev</a>
        <a href="https://www.linkedin.com/in/gabriel-n-pianissola/">linkedin.com/in/gabriel-n-pianissola</a>
        <a href="https://github.com/DellPianissola">github.com/DellPianissola</a>
    </div>
    <img class="me" src="../images/profile/gabriel-960.webp" alt="">
</header>
<div class="page">
    <main>
        <section><h2 data-t="aboutTitle"></h2><p class="lead" data-t="about"></p></section>
        <section><h2 data-t="xpTitle"></h2><div id="jobs"></div></section>
        <section><h2 data-t="projectsTitle"></h2><ul class="projs" id="projs"></ul></section>
    </main>
    <aside>
        <section><h2 data-t="stackTitle"></h2><dl class="stack" id="stack"></dl></section>
        <section><h2 data-t="eduTitle"></h2><ul class="edu" id="edu"></ul></section>
        <section><h2 data-t="langTitle"></h2><p data-t="langs"></p></section>
    </aside>
</div>
<script type="module">
import { dict } from '../js/i18n.js';

const COPY = {
    pt: {
        role: 'Desenvolvedor full stack com foco em arquitetura de software',
        aboutTitle: 'Resumo',
        about: 'Mais de 5 anos construindo sistemas, de ponta a ponta, em web, mobile e desktop. Assumo o problema inteiro, do banco ao deploy, e registro as decisões importantes com contexto, alternativas e custo.',
        xpTitle: 'Experiência',
        jobs: [
            { id: 'kaffa', name: 'Kaffa', items: [
                'criei a solução que reduziu em mais de 90% a base necessária para rodar o app.',
                '<b>Import de DWG além do limite:</b> carregamento em pacotes no canvas SWT superou o tamanho máximo de arquivo e reduziu a latência ao mover o mapa.',
                '<b>IA no fluxo com o QA:</b> documentação gerada por IA para testar bugs e histórias de usuário, diminuindo o gargalo de testes.',
                'Responsável pela camada Android. React na web, SWT no desktop, Kotlin e Java no servidor Nomad, mapas e GIS.',
            ] },
            { id: 'senai', items: [
                'entrei com metade do prazo já corrido e o backend na estaca zero, assumi a arquitetura e o backend inteiro e entregamos além do escopo pedido.',
                '<b>SSE:</b> comunicação assíncrona entre back e front com Server-Sent Events, documentada para o cliente evoluir sozinho.',
                '<b>API do time de IA:</b> assumi o serviço em FastAPI e integrei ao backend os algoritmos de KPIs e inferências.',
                '<b>Grandes arquivos:</b> upload direto com URLs assinadas, com Google Cloud Storage e MinIO.',
            ] },
        ],
        projectsTitle: 'Projetos',
        projects: [
            ['Citria', 'https://citria.pianissola.tech/', 'App e web que conectam paciente e nutricionista entre as consultas. React Native, NestJS, PostgreSQL, testes e2e com Testcontainers.'],
            ['Inside', '', 'Gestão de software house, do lead à divisão do caixa. Spring Boot, OAuth 2 e OIDC, row level security, transactional outbox.'],
            ['Íris', '', 'Laboratório de cores para testar paletas com o próprio logo, sem backend: o arquivo não sai do navegador. React, TypeScript.'],
            ['Whatchu', 'https://github.com/DellPianissola/whatchu', 'Sorteio do que assistir com pesos combináveis e listas de amigos. React, Node.js, Prisma, Docker. Código aberto.'],
        ],
        stackTitle: 'Stack',
        stack: [
            ['Front-end', 'React, Next.js, TypeScript'],
            ['Back-end', 'Node.js, NestJS, Express, Python, Django REST Framework, FastAPI, Java, Spring Boot, Kotlin'],
            ['Mobile', 'React Native, Expo, Android'],
            ['Dados', 'PostgreSQL, MySQL, Prisma, S3'],
            ['Arquitetura', 'Monolito modular, microsserviços, DDD, multi-tenant, OAuth 2, OIDC'],
            ['Infra e CI/CD', 'Docker, nginx, Cloudflare, GitHub Actions'],
            ['Testes', 'Vitest, Jest, pytest, Testcontainers'],
        ],
        eduTitle: 'Formação',
        edu: [
            ['unip', 'UNIP'],
            ['etep', 'ETEP', 'Time de programação na competição de robótica FIRST'],
        ],
        langTitle: 'Idiomas',
        langs: 'Português e inglês no dia a dia',
    },
    en: {
        role: 'Full stack developer focused on software architecture',
        aboutTitle: 'Summary',
        about: 'Over 5 years building systems end to end across web, mobile and desktop. I take on the whole problem, from database to deploy, and record important decisions with their context, alternatives and cost.',
        xpTitle: 'Experience',
        jobs: [
            { id: 'kaffa', name: 'Kaffa', items: [
                'built the solution that cut the base needed to run the app by more than 90%.',
                '<b>DWG import past the limit:</b> chunked loading into the SWT canvas went past the maximum file size and reduced latency when moving the map.',
                '<b>AI in the QA workflow:</b> AI-generated documentation for testing bugs and user stories, reducing the testing bottleneck.',
                'Responsible for the Android layer. React on the web, SWT on desktop, Kotlin and Java on the Nomad server, maps and GIS.',
            ] },
            { id: 'senai', items: [
                'joined with half the deadline gone and the backend at square one, took over the architecture and the entire backend, and we delivered beyond the requested scope.',
                '<b>SSE:</b> async communication between back and front with Server-Sent Events, documented so the client could evolve it alone.',
                "<b>The AI team's API:</b> took over the FastAPI service and integrated the KPI and inference algorithms into the backend.",
                '<b>Large files:</b> direct upload with signed URLs, using Google Cloud Storage and MinIO.',
            ] },
        ],
        projectsTitle: 'Projects',
        projects: [
            ['Citria', 'https://citria.pianissola.tech/', 'App and web connecting patients and nutritionists between appointments. React Native, NestJS, PostgreSQL, e2e tests with Testcontainers.'],
            ['Inside', '', 'Software house management, from lead to cash split. Spring Boot, OAuth 2 and OIDC, row level security, transactional outbox.'],
            ['Íris', '', 'Colour lab to try palettes with your own logo, with no backend: the file never leaves the browser. React, TypeScript.'],
            ['Whatchu', 'https://github.com/DellPianissola/whatchu', 'Draws what to watch with combinable weights and friends\' lists. React, Node.js, Prisma, Docker. Open source.'],
        ],
        stackTitle: 'Stack',
        stack: [
            ['Front end', 'React, Next.js, TypeScript'],
            ['Back end', 'Node.js, NestJS, Express, Python, Django REST Framework, FastAPI, Java, Spring Boot, Kotlin'],
            ['Mobile', 'React Native, Expo, Android'],
            ['Data', 'PostgreSQL, MySQL, Prisma, S3'],
            ['Architecture', 'Modular monolith, microservices, DDD, multi-tenancy, OAuth 2, OIDC'],
            ['Infra and CI/CD', 'Docker, nginx, Cloudflare, GitHub Actions'],
            ['Tests', 'Vitest, Jest, pytest, Testcontainers'],
        ],
        eduTitle: 'Education',
        edu: [
            ['unip', 'UNIP'],
            ['etep', 'ETEP', 'Programming team at the FIRST robotics competition'],
        ],
        langTitle: 'Languages',
        langs: 'Portuguese and English day to day',
    },
};

const lang = location.hash === '#en' ? 'en' : 'pt';
const copy = COPY[lang];
const field = (id, key) => dict[lang][`experience.${id}${key}`];
document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
document.title = `Gabriel Pianissola CV (${lang.toUpperCase()})`;

document.querySelectorAll('[data-t]').forEach(el => { el.textContent = copy[el.dataset.t]; });
document.getElementById('jobs').innerHTML = copy.jobs.map(job => `
    <article class="job">
        <div class="job-head"><b>${job.name ?? field(job.id, 'Name')}</b><time>${field(job.id, 'Date')}</time></div>
        <p class="job-role">${field(job.id, 'Role')}</p>
        <ul>${job.items.map((item, i) => `<li>${i ? item : `<b>${field(job.id, 'MetricValue')}:</b> ${item}`}</li>`).join('')}</ul>
    </article>`).join('');
document.getElementById('projs').innerHTML = copy.projects.map(([name, url, text]) =>
    `<li><b>${url ? `<a href="${url}">${name}</a>` : name}.</b> <span>${text}</span></li>`).join('');
document.getElementById('stack').innerHTML = copy.stack.map(([term, tools]) => `<dt>${term}</dt><dd>${tools}</dd>`).join('');
document.getElementById('edu').innerHTML = copy.edu.map(([id, school, note]) => `<li><b>${field(id, 'Role')}</b><span>${school}, ${field(id, 'Date')}${note ? `. ${note}` : ''}</span></li>`).join('');
</script>
</body>
</html>
